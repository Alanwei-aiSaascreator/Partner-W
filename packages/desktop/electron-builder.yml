appId: com.mofangluopan.app
productName: Partner-W
directories:
  buildResources: build
  output: dist
publish:
  # 更新源必须指向自己的 feed，不能指向上游 clawwork-ai/clawwork ——
  # 否则「检查更新」会把 ClawWork 官方包装进来，覆盖整个商业层。
  # electron-updater 不认 Gitee，所以用 generic + 自托管静态目录。
  # 该目录现在可以还没有文件：查不到更新即「已是最新」；
  # 将来把 latest.yml 与安装包放上去即可启用，不用再改代码。
  provider: generic
  url: https://api.rongyinghudong.com/updates/
extraResources:
  - from: build/icon.png
    to: icon.png
  # T-U0「fat installer」：把**出厂运行时**随包发出去，落到 `<resources>/runtime`
  # （Windows 上 = 安装目录\resources\runtime）。没有它，一台从没部署过运行时的机器
  # 装上我们的包**必然起不来** —— 客户端侧认这份的候选叫 `bundled`，
  # 见 src/main/runtime/locate.ts 的 resolveBundledRuntimeRoot()。
  #
  # ⚠️ `from` 的基准是 **projectDir**，也就是"运行 electron-builder 的那个目录"
  #    （npm script 从 packages/desktop 启动 ⇒ projectDir = packages/desktop），
  #    **不是** yml 所在目录、也不是 appDir。依据是 app-builder-lib 源码：
  #    `createGetFileMatchersOptions()` 里写死 `defaultSrc: this.projectDir`，
  #    而 `getFileMatchers()` 用 `path.resolve(defaultSrc, pattern.from)`；
  #    `packager.js` 里 `projectDir = options.projectDir == null ? process.cwd() : ...`。
  #    ⇒ `runtime-out/` 在**仓库根** ⇒ 这里必须是 `../../runtime-out`。
  #
  # ⚠️ 源不存在时 electron-builder **只 warn 不报错**（fileMatcher.js 的
  #    "file source doesn't exist"）—— 那正是这次事故的形状（静默打出一个没有运行时的包）。
  #    所以下面挂了 beforePack 钩子把"缺运行时"变成**硬失败**。
  - from: ../../runtime-out
    to: runtime
    # ⚠️ 必须排除 kb-model：`runtime-out` 是**整个**映射进 `<resources>/runtime` 的，
    #    而运行时在首次启动时会把 `<resources>/runtime` **复制到 userData**
    #    ⇒ 不排除的话 90MB 模型会被白拷一份，而且是被当成运行时内容来拷的。
    filter:
      - '**/*'
      - '!kb-model/**'
  # T6b：本地嵌入模型（bge-small-zh-v1.5，约 91MB）。单独映射成 `<resources>/kb-model`，
  # **不能**塞在上面那个 runtime 映射里（见上一条）。客户端侧的解析见
  # `src/main/kb/embedding/`（打包态用 process.resourcesPath + kb-model）。
  # 产出方式：仓库根跑 `node scripts/fetch-kb-model.mjs`。
  - from: ../../runtime-out/kb-model
    to: kb-model
  # T-a2：「我们自己的技能」—— 技能市场里列的那批（中文名/描述），用户点一下就装。
  # 落点是 `<resources>/our-skills`，客户端侧见 `src/main/skills/locate.ts`。
  #
  # ⚠️ 技能要么在包里、要么整个功能就是个空页面。运行时的加载器对**格式不对 = 静默丢弃**，
  #    所以这里除了"源在不在"（`beforePack` 钩子会自动查），
  #    还有一道**内容闸**在 `test/our-skills-packaging-gate.test.ts`：
  #    逐个技能解析 frontmatter，`name`/`description` 缺一即红。
  #
  # ⚠️ `to:` 必须与 `locate.ts` 的 `OUR_SKILLS_DIR_NAME` 一字不差，靠上面那个测试钉住。
  - from: our-skills
    to: our-skills
  # PPTX 模板（`resources/pptx-templates/*.pptx`，自制、随包分发）。
  # 落点是 `<resources>/pptx-templates`，客户端侧见
  # `src/main/docgen/pptx-template/locate.ts`。
  #
  # ⚠️ 必须走 extraResources 而**不能**打进 app.asar：
  #    主进程要把 .pptx 当**普通文件**交给 pptx-automizer 读，
  #    而 asar 里的路径是虚拟的、普通 fs / zip 读取器读不了。
  #    同理，这个目录**只读**：产出写到任务目录，由现成的产物通道落盘。
  #
  # ⚠️ `to:` 必须与 `locate.ts` 的 `PPTX_TEMPLATES_DIR_NAME` 一字不差 ——
  #    漂移的表现是"模板填充永远失败而开发态一切正常"，
  #    靠 `test/pptx-template-packaging-gate.test.ts` 断言两者相等钉住。
  - from: resources/pptx-templates
    to: pptx-templates
  # 冷启动开场片（1 分钟，含内嵌音轨）。落点 `<resources>/media`，客户端侧见
  # `src/main/media/opening-asset.ts`（`clawwork-asset://media/opening.mp4`）。
  #
  # ⚠️ 媒体**绝不能**打进 app.asar（同 pptx-templates 的理由：大文件走 extraResources，
  #    且真机现场"删掉 opening.mp4 即回兜底"的 kill-switch 依赖它是普通文件）。
  #
  # ⚠️ `to:` 必须与 `@clawwork/shared` 的 `OPENING_MEDIA_DIR_NAME` 一字不差，
  #    靠 `test/opening-media-packaging-gate.test.ts` 钉住。
  #
  # ⚠️ `resources/media/` 目录里**必须永远有一个占位文件**（.gitkeep）：
  #    `scripts/require-bundled-runtime.cjs` 对字面量源的缺失是**硬失败** ——
  #    删掉占位文件会让构建直接红，且报错文案会误导成"随包运行时缺源"。
  - from: resources/media
    to: media
  # 「连接器 · 飞书」自带安装（2026-10-17 用户要求）：把官方插件 tgz **随包**发出去，
  # 客户盘第一次接入时 `plugins install <本机 tgz>`，**不需要联网下载**。
  # 该 tgz 的 bundleDependencies 覆盖全部 6 个依赖 ⇒ 安装过程不访问 npm registry。
  # ⚠️ `to:` 必须与 `src/main/connectors/feishu.ts` 的 `FEISHU_PLUGIN_DIR_NAME` 一字不差，
  #    靠 `test/feishu-connector-packaging-gate.test.ts` 钉住。
  - from: resources/connectors
    to: connectors
# ⚠️ electron-builder 只接受**一个** beforePack ⇒ 这里是组合钩子，
#    两道门禁（随包运行时 / 内嵌更新公钥）各自的判定在各自那个文件里。
beforePack: ./scripts/before-pack.cjs

# 原生二进制**不能**从 app.asar 里加载（`LoadLibrary` 读不了 asar 虚拟路径）。
# better-sqlite3 / win-ca 由 electron-builder 自动解包；onnxruntime-node 是**自己按路径
# 去 bin/napi-v6/<平台>/<架构>/ 找 .node 和 .dll** 的，自动检测未必覆盖得到，所以写明。
# 漏了它的表现：开发态一切正常，装出来的包里"资料库索引永远建不出来"。
asarUnpack:
  - '**/node_modules/onnxruntime-node/**'

files:
  - 'out/**/*'
  - 'node_modules/**/*'
  # ⭐ 打包垫片：把 `readable-stream/passthrough` 这个入口补回顶层那份 readable-stream@3。
  #
  #   为什么：`exceljs` → `archiver` → `archiver-utils` → `lazystream` 在**模块顶层**
  #   `require('readable-stream/passthrough')`；`lazystream` 要的是 v2（v2 有这个根级入口），
  #   而 v3 **删掉了它**。开发树没事（pnpm 给 lazystream 配了旁边的 v2），
  #   但 electron-builder 把 pnpm 的树**压平**、那份 v2 没了 ⇒ 解析到顶层 v3 ⇒ MODULE_NOT_FOUND
  #   ⇒ **打包态里 `require('exceljs')` 直接抛错，一个 .xlsx 都产不出来**（2026-09-25 实测）。
  #
  #   垫片内容与 v2 原文逐字相同（见 `packaging-shims/readable-stream/passthrough.js` 的说明）；
  #   `test/readable-stream-shim-packaging-gate.test.ts` 钉住这条映射与那个文件。
  - from: packaging-shims/readable-stream
    to: node_modules/readable-stream
  # ⚠️ 排掉工作区软链（`@clawwork/core` / `@clawwork/shared` → `packages/*`）。
  #    理由有两条，第二条是**必须**：
  #    ① 它们被 `electron-vite.config.ts` 的 `externalizeDepsPlugin({ exclude: [...] })`
  #       **打进了 `out/`**（等于"不外部化"），运行时根本不会去 node_modules 里 require 它们 ⇒
  #       打进包只是白白多一份源码。
  #    ② 更要命的是：软链的目标在 app 目录**之外**，electron-builder 走到 asar 那一步会直接报
  #       `<repo>/packages/core/dist/index.d.ts.map must be under <repo>/packages/desktop/`。
  #       这个雷**只在 `packages/core/dist` 非空时才炸** —— 而 `pnpm typecheck`（`tsc -b`）
  #       正好会把它填满。换句话说：**先跑 typecheck 再打包 = 构建失败**，
  #       而两次发版之间没人跑过它，所以一直没被发现。2026-09-18 加 T6b 时撞上并修掉。
  - '!../core/**'
  - '!../shared/**'
  # onnxruntime-web 是浏览器/WASM 后端，Node 走的是 onnxruntime-node。
  # 实测：把这个包整个移走，嵌入照样出向量（dim=512）。140MB 纯死重。
  - '!**/onnxruntime-web/**'
  - 'package.json'
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
afterPack: ./scripts/afterPack.cjs
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # 见 win.files 那条说明（为什么要裁、为什么基础三条要重复写）。mac 出 arm64 + x64，
  # darwin 两套都留着 —— 只有 linux / win32 是死重。
  files:
    - 'out/**/*'
    - 'node_modules/**/*'
    - '!../core/**'
    - '!../shared/**'
    - '!**/onnxruntime-web/**'
    # 见顶层 files 里的说明：exceljs 在打包态会因为 lazystream 找不到
    # `readable-stream/passthrough` 而**整个加载失败**。平台级 files 会覆盖顶层，所以这里也要写。
    - from: packaging-shims/readable-stream
      to: node_modules/readable-stream
    - 'package.json'
    - '!**/onnxruntime-node/bin/napi-v6/linux/**'
    - '!**/onnxruntime-node/bin/napi-v6/win32/**'
  extendInfo:
    NSMicrophoneUsageDescription: Partner-W needs microphone access for voice dictation in chat input.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # ⚠️ onnxruntime-node 把**三个平台**的二进制都放在包里（darwin 86MB + linux 69MB +
  #    win32 134MB = 289MB），而我们只需要自己那一个。不裁的话 Windows 安装包会白背
  #    225MB 死重（darwin/linux 各一份 + win32 里我们用不到的 arm64）。
  # ⚠️ 基础三条**故意重复写**：electron-builder 的平台级 `files` 是"覆盖顶层"还是
  #    "叠加"没有明确文档，两种写法都重复一遍 ⇒ 无论它按哪种语义都拿到完整集合。
  # ⚠️ 用 `**/onnxruntime-node/...` 而不是 `node_modules/...`：pnpm 下这个包在
  #    `node_modules/.pnpm/onnxruntime-node@<ver>/...`，`node_modules/onnxruntime-node`
  #    只是个软链 —— 只写一条会漏掉真实路径。
  files:
    - 'out/**/*'
    - 'node_modules/**/*'
    - '!../core/**'
    - '!../shared/**'
    - '!**/onnxruntime-web/**'
    # 见顶层 files 里的说明：exceljs 在打包态会因为 lazystream 找不到
    # `readable-stream/passthrough` 而**整个加载失败**。平台级 files 会覆盖顶层，所以这里也要写。
    - from: packaging-shims/readable-stream
      to: node_modules/readable-stream
    - 'package.json'
    - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!**/onnxruntime-node/bin/napi-v6/linux/**'
    - '!**/onnxruntime-node/bin/napi-v6/win32/arm64/**'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  icon: build/icon.png
  # 见 win.files 那条说明。linux 只出 x64 ⇒ darwin（含两套架构）和 win32 都是死重。
  files:
    - 'out/**/*'
    - 'node_modules/**/*'
    - '!../core/**'
    - '!../shared/**'
    - '!**/onnxruntime-web/**'
    # 见顶层 files 里的说明：exceljs 在打包态会因为 lazystream 找不到
    # `readable-stream/passthrough` 而**整个加载失败**。平台级 files 会覆盖顶层，所以这里也要写。
    - from: packaging-shims/readable-stream
      to: node_modules/readable-stream
    - 'package.json'
    - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!**/onnxruntime-node/bin/napi-v6/win32/**'
  maintainer: samzong <samzong.lu@gmail.com>
  desktop:
    StartupWMClass: mofangluopan
