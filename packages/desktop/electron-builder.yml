appId: com.mofangluopan.app
productName: 荣盈魔方
directories:
  buildResources: build
  output: dist
publish:
  # 更新源必须指向自己的 feed，不能指向上游 clawwork-ai/clawwork ——
  # 否则「检查更新」会把 ClawWork 官方包装进来，覆盖整个商业层。
  # electron-updater 不认 Gitee，所以用 generic + 自托管静态目录。
  # 该目录现在可以还没有文件：查不到更新即「已是最新」；
  # 将来把 latest.yml 与安装包放上去即可启用，不用再改代码。
  provider: generic
  url: https://api.rongyinghudong.com/updates/
extraResources:
  - from: build/icon.png
    to: icon.png
  # T-U0「fat installer」：把**出厂运行时**随包发出去，落到 `<resources>/runtime`
  # （Windows 上 = 安装目录\resources\runtime）。没有它，一台从没部署过运行时的机器
  # 装上我们的包**必然起不来** —— 客户端侧认这份的候选叫 `bundled`，
  # 见 src/main/runtime/locate.ts 的 resolveBundledRuntimeRoot()。
  #
  # ⚠️ `from` 的基准是 **projectDir**，也就是"运行 electron-builder 的那个目录"
  #    （npm script 从 packages/desktop 启动 ⇒ projectDir = packages/desktop），
  #    **不是** yml 所在目录、也不是 appDir。依据是 app-builder-lib 源码：
  #    `createGetFileMatchersOptions()` 里写死 `defaultSrc: this.projectDir`，
  #    而 `getFileMatchers()` 用 `path.resolve(defaultSrc, pattern.from)`；
  #    `packager.js` 里 `projectDir = options.projectDir == null ? process.cwd() : ...`。
  #    ⇒ `runtime-out/` 在**仓库根** ⇒ 这里必须是 `../../runtime-out`。
  #
  # ⚠️ 源不存在时 electron-builder **只 warn 不报错**（fileMatcher.js 的
  #    "file source doesn't exist"）—— 那正是这次事故的形状（静默打出一个没有运行时的包）。
  #    所以下面挂了 beforePack 钩子把"缺运行时"变成**硬失败**。
  - from: ../../runtime-out
    to: runtime
beforePack: ./scripts/require-bundled-runtime.cjs

files:
  - 'out/**/*'
  - 'node_modules/**/*'
  - 'package.json'
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
afterPack: ./scripts/afterPack.cjs
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: 荣盈魔方 needs microphone access for voice dictation in chat input.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  icon: build/icon.png
  maintainer: samzong <samzong.lu@gmail.com>
  desktop:
    StartupWMClass: mofangluopan
