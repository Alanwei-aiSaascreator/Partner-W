appId: com.mofangluopan.app
productName: 荣盈魔方
directories:
  buildResources: build
  output: dist
publish:
  # 更新源必须指向自己的 feed，不能指向上游 clawwork-ai/clawwork ——
  # 否则「检查更新」会把 ClawWork 官方包装进来，覆盖整个商业层。
  # electron-updater 不认 Gitee，所以用 generic + 自托管静态目录。
  # 该目录现在可以还没有文件：查不到更新即「已是最新」；
  # 将来把 latest.yml 与安装包放上去即可启用，不用再改代码。
  provider: generic
  url: https://api.rongyinghudong.com/updates/
extraResources:
  - from: build/icon.png
    to: icon.png

files:
  - 'out/**/*'
  - 'node_modules/**/*'
  - 'package.json'
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
afterPack: ./scripts/afterPack.cjs
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: 荣盈魔方 needs microphone access for voice dictation in chat input.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  icon: build/icon.png
  maintainer: samzong <samzong.lu@gmail.com>
  desktop:
    StartupWMClass: mofangluopan
